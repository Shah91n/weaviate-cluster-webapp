# NOTE: do not set client.showSidebarNavigation = false here. It sets
# hide_sidebar_nav on the frontend, which hides the st.navigation menu too — not just
# the legacy pages/ auto-navigation. Calling st.navigation already makes Streamlit
# ignore the pages/ directory, so no suppression is needed.

# Disable anonymous usage statistics collection
[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Theme: this app is an instrument, not a landing page. Its job is to tell you
# quickly whether a cluster is unhealthy, so COLOUR IS A STATUS CHANNEL, NOT
# DECORATION.
#
#   Chrome   neutral slate greys — sidebar, panels, borders, text. No hue tint,
#            so nothing in the frame competes with a status colour.
#   Action   one indigo (#5850E6; #8C8FF5 in dark) for primary buttons, the active page and links.
#            Mid-tone on purpose: it reads as "clickable", not as a dark slab.
#   Status   four hues, one meaning each, never reused as decoration:
#              green  = healthy / done        amber = needs a look
#              red    = broken / destructive  sky   = neutral information
#            Each hue is distinct from its neighbours, so warning, error and info
#            are told apart at a glance rather than by reading the text.
#   Neutral  grey for "no state" — e.g. not connected yet is not an error.
#
# Fonts: Inter (UI) and JetBrains Mono (code) from Google Fonts. Extra polish —
# gradients, cards, hover — lives in assets/styles.css.
# ---------------------------------------------------------------------------
[theme]
base = "light"

# Light is soft, not stark: an off-white ground with slightly deeper panels, so
# the page does not glare and the panels still separate from it.
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#E8EAEE"
textColor = "#1E2430"
borderColor = "#D6DAE1"
dataframeHeaderBackgroundColor = "#E8EAEE"
dataframeBorderColor = "#D6DAE1"

# Action
primaryColor = "#5850E6"
linkColor = "#463FC9"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.75rem"

# Status vocabulary — one hue per meaning. Tints are deep enough to show on the
# off-white ground; text is the darkest shade of the same hue.
greenColor = "#1F9D55"
greenBackgroundColor = "#DDEFE3"
greenTextColor = "#1A5E37"
yellowColor = "#C08A0C"
yellowBackgroundColor = "#F4EACB"
yellowTextColor = "#76520A"
orangeColor = "#DD6420"
orangeBackgroundColor = "#F7E2D3"
orangeTextColor = "#8A3A12"
redColor = "#D33A3A"
redBackgroundColor = "#F5DCDC"
redTextColor = "#8E2222"
blueColor = "#1F86C4"
blueBackgroundColor = "#DBEAF4"
blueTextColor = "#185C86"
violetColor = "#7A4FE0"
violetBackgroundColor = "#E8E1F8"
violetTextColor = "#51309A"
grayColor = "#6B7686"
grayBackgroundColor = "#E3E6EB"
grayTextColor = "#4A5462"

# Chart series lead with the action indigo; red is left out so no series reads as
# an error. chartSequentialColors must be exactly 10 stops — Streamlit logs an error
# and falls back to its own palette otherwise.
chartCategoricalColors = ["#5850E6", "#1F9BD7", "#1F9D55", "#E0A21A", "#D1487F", "#6B7686"]
chartSequentialColors = ["#E6E8FB", "#D3D6F8", "#BCC0F5", "#A2A6F1", "#8A8DEE", "#7470EA", "#5850E6", "#4A42CC", "#3D36A8", "#302A84"]

# The sidebar frames the work; it does not compete with it.
[theme.sidebar]
backgroundColor = "#EBEDF1"
secondaryBackgroundColor = "#DFE2E8"
textColor = "#1E2430"
primaryColor = "#5850E6"
borderColor = "#D6DAE1"
linkColor = "#463FC9"
showWidgetBorder = true

# Dark follows the OS appearance. It is a lifted charcoal rather than near-black,
# and the status boxes use low-saturation tints with soft text of the same hue, so
# a warning reads as amber instead of bright yellow on brown.
[theme.dark]
backgroundColor = "#262A32"
secondaryBackgroundColor = "#30353F"
textColor = "#E3E6EB"
borderColor = "#3F4551"
dataframeHeaderBackgroundColor = "#30353F"
dataframeBorderColor = "#3F4551"
primaryColor = "#8C8FF5"
linkColor = "#A9ACF8"

greenColor = "#5CC98A"
greenBackgroundColor = "#2A3B33"
greenTextColor = "#B5E3C6"
yellowColor = "#E0B84A"
yellowBackgroundColor = "#3B372B"
yellowTextColor = "#EBD9A6"
orangeColor = "#EE9A5B"
orangeBackgroundColor = "#3E332B"
orangeTextColor = "#F0CDAE"
redColor = "#EE7B7B"
redBackgroundColor = "#402D30"
redTextColor = "#F3BDBD"
blueColor = "#5DB6E6"
blueBackgroundColor = "#28384A"
blueTextColor = "#B7DAF0"
violetColor = "#A88BF2"
violetBackgroundColor = "#352F4A"
violetTextColor = "#D5C9F7"
grayColor = "#9AA3B1"
grayBackgroundColor = "#353A44"
grayTextColor = "#C9CFD8"

chartCategoricalColors = ["#8C8FF5", "#5DB6E6", "#5CC98A", "#E0B84A", "#E57FA6", "#9AA3B1"]
chartSequentialColors = ["#30353F", "#363A55", "#3D406B", "#454781", "#4E5097", "#5A5BAD", "#6869C3", "#7778D6", "#8C8FF5", "#A9ACF8"]

[theme.dark.sidebar]
backgroundColor = "#1F2229"
secondaryBackgroundColor = "#2B2F38"
textColor = "#E3E6EB"
primaryColor = "#8C8FF5"
borderColor = "#3A404B"
linkColor = "#A9ACF8"
showWidgetBorder = true
